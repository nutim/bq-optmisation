[project]
name = "bigquery-finops-agent"
version = "0.1.0"
description = "Multi-project BigQuery cost and storage optimization agent for Google Cloud"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-adk>=2.0,<3",
  "google-cloud-bigquery>=3.30,<4",
  "google-cloud-pubsub>=2.25,<3",
  "google-genai>=1.30,<2",
  "google-auth>=2.38,<3",
  "opentelemetry-exporter-gcp-trace>=1.9,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlglot>=26,<29",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
  "mcp>=1.26,<2",
  "google-cloud-secret-manager>=2.24,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "sql"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
